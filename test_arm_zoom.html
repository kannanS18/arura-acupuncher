<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; background: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    #container { width: 100vw; height: 100vh; position: relative; }
    canvas { width: 100%; height: 100%; display: block; }
    .top-bar {
      position: absolute; top: 16px; left: 16px; right: 16px;
      display: flex; justify-content: space-between; align-items: center;
      pointer-events: none; z-index: 10;
    }
    .badge {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 14px; border-radius: 9999px;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid rgba(226, 232, 240, 0.9);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      font-size: 11px; font-weight: 800; color: #09090b; letter-spacing: 0.05em;
    }
    .badge-dot { width: 8px; height: 8px; border-radius: 50%; background: #e02868; }
    .btn {
      pointer-events: auto;
      display: flex; align-items: center; gap: 6px;
      padding: 6px 14px; border-radius: 12px;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid rgba(226, 232, 240, 0.9);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
      font-size: 11px; font-weight: 700; color: #334155; cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="container">
    <div class="top-bar">
      <div class="badge">
        <span class="badge-dot"></span>
        <span>ARURA 3D CLINICAL ANATOMY</span>
      </div>
      <button class="btn" id="triggerBtn">Click Arm to Zoom & Reveal Acupoints</button>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "/node_modules/three/build/three.module.js",
        "three/addons/": "/node_modules/three/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const container = document.getElementById('container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf8fafc);

    const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 50);
    camera.position.set(0, 0.34, 4.2);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    container.appendChild(renderer.domElement);

    const hemiLight = new THREE.HemisphereLight(0xffffff, 0xe2e8f0, 1.25);
    scene.add(hemiLight);

    const keyLight = new THREE.DirectionalLight(0xffffff, 1.6);
    keyLight.position.set(2.5, 5, 3.5);
    keyLight.castShadow = true;
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0xffe4e6, 0.55);
    fillLight.position.set(-2.5, 2, 2);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(0xffffff, 0.85);
    rimLight.position.set(0, 2, -3);
    scene.add(rimLight);

    // Floor and Pedestal
    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(16, 16),
      new THREE.ShadowMaterial({ opacity: 0.08 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -0.49;
    floor.receiveShadow = true;
    scene.add(floor);

    const pedestal = new THREE.Mesh(
      new THREE.CylinderGeometry(0.48, 0.52, 0.03, 48),
      new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2, metalness: 0.1 })
    );
    pedestal.position.y = -0.47;
    pedestal.receiveShadow = true;
    scene.add(pedestal);

    const ringLed = new THREE.Mesh(
      new THREE.RingGeometry(0.46, 0.50, 48),
      new THREE.MeshBasicMaterial({ color: 0xe02868, side: THREE.DoubleSide })
    );
    ringLed.rotation.x = -Math.PI / 2;
    ringLed.position.y = -0.45;
    scene.add(ringLed);

    function createBadgeCanvas(name, code, depth) {
      const canvas = document.createElement('canvas');
      canvas.width = 240;
      canvas.height = 70;
      const ctx = canvas.getContext('2d');

      // Card pill background
      ctx.fillStyle = 'rgba(255, 255, 255, 0.98)';
      if (ctx.roundRect) ctx.roundRect(4, 4, 232, 62, 14);
      else ctx.rect(4, 4, 232, 62);
      ctx.fill();

      // Border with Arura rose accent
      ctx.strokeStyle = '#e02868';
      ctx.lineWidth = 3;
      ctx.stroke();

      // Badge Code & Depth Pill
      ctx.fillStyle = '#e02868';
      if (ctx.roundRect) ctx.roundRect(14, 14, 60, 42, 8);
      else ctx.rect(14, 14, 60, 42);
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 20px -apple-system, BlinkMacSystemFont, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(code, 44, 35);

      // Name & Translation
      ctx.fillStyle = '#09090b';
      ctx.font = 'bold 18px -apple-system, BlinkMacSystemFont, sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(name, 84, 27);

      ctx.fillStyle = '#64748b';
      ctx.font = '600 13px -apple-system, BlinkMacSystemFont, sans-serif';
      ctx.fillText(`Target: ${depth}`, 84, 48);

      return canvas;
    }

    const loader = new GLTFLoader();
    loader.load('/models/human_body.glb', (gltf) => {
      let sourceMesh = null;
      gltf.scene.traverse(c => { if (c.isMesh && !sourceMesh) sourceMesh = c; });
      if (!sourceMesh) return;

      const origGeo = sourceMesh.geometry;
      const count = origGeo.attributes.position.count;
      const positions = origGeo.attributes.position.array;

      const rootBone = new THREE.Bone();
      rootBone.name = 'root';
      rootBone.position.set(0, 0, 0);

      const spineBone = new THREE.Bone();
      spineBone.name = 'spine';
      spineBone.position.set(0, 0.20, 0);
      rootBone.add(spineBone);

      // Left Arm
      const leftUpperArm = new THREE.Bone();
      leftUpperArm.name = 'leftUpperArm';
      leftUpperArm.position.set(-0.026, 0.308, 0.082);
      rootBone.add(leftUpperArm);

      const leftForearm = new THREE.Bone();
      leftForearm.name = 'leftForearm';
      leftForearm.position.set(0.003, -0.206, 0.052);
      leftUpperArm.add(leftForearm);

      // Right Arm
      const rightUpperArm = new THREE.Bone();
      rightUpperArm.name = 'rightUpperArm';
      rightUpperArm.position.set(-0.026, 0.308, -0.082);
      rootBone.add(rightUpperArm);

      const rightForearm = new THREE.Bone();
      rightForearm.name = 'rightForearm';
      rightForearm.position.set(0.003, -0.206, -0.052);
      rightUpperArm.add(rightForearm);

      // Left Leg
      const leftThigh = new THREE.Bone();
      leftThigh.name = 'leftThigh';
      leftThigh.position.set(-0.012, -0.043, 0.039);
      rootBone.add(leftThigh);

      const leftCalf = new THREE.Bone();
      leftCalf.name = 'leftCalf';
      leftCalf.position.set(-0.013, -0.205, 0.002);
      leftThigh.add(leftCalf);

      // Right Leg
      const rightThigh = new THREE.Bone();
      rightThigh.name = 'rightThigh';
      rightThigh.position.set(-0.012, -0.043, -0.039);
      rootBone.add(rightThigh);

      const rightCalf = new THREE.Bone();
      rightCalf.name = 'rightCalf';
      rightCalf.position.set(-0.013, -0.205, -0.002);
      rightThigh.add(rightCalf);

      const bones = [
        rootBone, spineBone,
        leftUpperArm, leftForearm,
        rightUpperArm, rightForearm,
        leftThigh, leftCalf,
        rightThigh, rightCalf
      ];

      function computeArmWeight(y, z, isLeft) {
        const sign = isLeft ? 1 : -1;
        const absZ = z * sign;
        if (absZ <= 0) return 0;
        if (y < -0.13 || y > 0.34) return 0;
        if (y < 0.22) {
          const minZ = 0.090 + Math.max(0, 0.15 - y) * 0.15;
          if (absZ > minZ) return 1.0;
          return 0;
        }
        const shoulderMinZ = 0.074 + (0.34 - y) * 0.05;
        if (absZ < shoulderMinZ) return 0;
        if (absZ > shoulderMinZ + 0.015) return 1.0;
        return (absZ - shoulderMinZ) / 0.015;
      }

      function computeLegWeight(y, z, isLeft) {
        const sign = isLeft ? 1 : -1;
        const absZ = z * sign;
        if (absZ <= 0.008) return 0;
        if (y > -0.05) return 0;
        if (y < -0.10) return 1.0;
        const hipWeight = Math.min(1.0, (-0.05 - y) / 0.05);
        let groinWeight = 1.0;
        if (absZ < 0.018) groinWeight = Math.max(0.0, (absZ - 0.008) / 0.01);
        return hipWeight * groinWeight;
      }

      const skinIndices = [];
      const skinWeights = [];

      for (let i = 0; i < count; i++) {
        const x = positions[i * 3];
        const y = positions[i * 3 + 1];
        const z = positions[i * 3 + 2];

        const wArmL = computeArmWeight(y, z, true);
        const wArmR = computeArmWeight(y, z, false);
        const wLegL = computeLegWeight(y, z, true);
        const wLegR = computeLegWeight(y, z, false);

        let b0 = 1, w0 = 1.0;
        let b1 = 0, w1 = 0.0;

        if (wArmL > 0) {
          if (y < 0.10) {
            b0 = 3; w0 = 1.0;
          } else {
            b0 = 2; w0 = wArmL;
            b1 = 1; w1 = 1.0 - wArmL;
          }
        } else if (wArmR > 0) {
          if (y < 0.10) {
            b0 = 5; w0 = 1.0;
          } else {
            b0 = 4; w0 = wArmR;
            b1 = 1; w1 = 1.0 - wArmR;
          }
        } else if (wLegL > 0) {
          if (y < -0.25) {
            b0 = 7; w0 = 1.0;
          } else {
            b0 = 6; w0 = wLegL;
            b1 = 0; w1 = 1.0 - wLegL;
          }
        } else if (wLegR > 0) {
          if (y < -0.25) {
            b0 = 9; w0 = 1.0;
          } else {
            b0 = 8; w0 = wLegR;
            b1 = 0; w1 = 1.0 - wLegR;
          }
        } else if (y < 0.08) {
          b0 = 0; w0 = 1.0;
        }

        skinIndices.push(b0, b1, 0, 0);
        skinWeights.push(w0, w1, 0, 0);
      }

      const geo = origGeo.clone();
      geo.setAttribute('skinIndex', new THREE.Uint16BufferAttribute(skinIndices, 4));
      geo.setAttribute('skinWeight', new THREE.Float32BufferAttribute(skinWeights, 4));

      const skinMat = new THREE.MeshStandardMaterial({
        color: 0xdeb89e,
        roughness: 0.38,
        metalness: 0.06
      });

      const skinnedMesh = new THREE.SkinnedMesh(geo, skinMat);
      skinnedMesh.castShadow = true;
      skinnedMesh.receiveShadow = true;

      const skeleton = new THREE.Skeleton(bones);
      skinnedMesh.add(rootBone);
      skinnedMesh.bind(skeleton);

      const targetHeight = 1.55;
      const scale = targetHeight / 1.0;
      skinnedMesh.scale.set(scale, scale, scale);
      skinnedMesh.position.y = 0.34;
      skinnedMesh.rotation.y = -Math.PI / 2;

      scene.add(skinnedMesh);

      // =======================================================================
      // CLINICAL ARM ACUPOINTS (Physically attached to Forearm bone!)
      // =======================================================================
      const armAcupoints = [
        {
          code: 'LI-11',
          name: 'Quchi (曲池)',
          depth: '15mm',
          // Attached near elbow (forearm local Y ≈ -0.015)
          pos: new THREE.Vector3(0.015, -0.015, 0.02)
        },
        {
          code: 'LU-7',
          name: 'Lieque (列缺)',
          depth: '8mm',
          // Attached mid/radial forearm (forearm local Y ≈ -0.10)
          pos: new THREE.Vector3(0.02, -0.10, -0.005)
        },
        {
          code: 'PC-6',
          name: 'Neiguan (内关)',
          depth: '10mm',
          // Attached inner forearm (forearm local Y ≈ -0.13)
          pos: new THREE.Vector3(0.005, -0.13, 0.025)
        },
        {
          code: 'HT-7',
          name: 'Shenmen (神门)',
          depth: '8mm',
          // Attached at wrist crease (forearm local Y ≈ -0.16)
          pos: new THREE.Vector3(-0.01, -0.165, 0.02)
        },
        {
          code: 'LI-4',
          name: 'Hegu (合谷)',
          depth: '12mm',
          // Attached on hand dorsum between 1st/2nd metacarpals (forearm local Y ≈ -0.20)
          pos: new THREE.Vector3(0.022, -0.205, -0.005)
        }
      ];

      const pinObjects = [];

      armAcupoints.forEach((pt, i) => {
        const pinGroup = new THREE.Group();
        pinGroup.position.copy(pt.pos);
        pinGroup.scale.set(0, 0, 0); // Initially hidden! Pops up sequentially!
        pinGroup.userData = { targetScale: 0.0, currentScale: 0.0, pt };

        // Pinpoint dot on skin
        const dot = new THREE.Mesh(
          new THREE.SphereGeometry(0.006, 12, 12),
          new THREE.MeshBasicMaterial({ color: 0xe02868 })
        );
        pinGroup.add(dot);

        // Luminous pulse ring
        const ring = new THREE.Mesh(
          new THREE.RingGeometry(0.007, 0.012, 16),
          new THREE.MeshBasicMaterial({ color: 0x0284c7, transparent: true, opacity: 0.9, side: THREE.DoubleSide })
        );
        ring.rotation.x = -Math.PI / 2;
        pinGroup.add(ring);

        // Leader line to callout badge
        const leaderOffsetX = 0.055;
        const leaderOffsetY = 0.025;
        const lineGeo = new THREE.BufferGeometry().setFromPoints([
          new THREE.Vector3(0, 0, 0),
          new THREE.Vector3(leaderOffsetX * 0.6, leaderOffsetY, 0),
          new THREE.Vector3(leaderOffsetX, leaderOffsetY, 0)
        ]);
        const lineMat = new THREE.LineBasicMaterial({ color: 0x64748b, transparent: true, opacity: 0.75 });
        const line = new THREE.Line(lineGeo, lineMat);
        pinGroup.add(line);

        // Callout Badge Sprite with actual name!
        const badgeTex = new THREE.CanvasTexture(createBadgeCanvas(pt.name, pt.code, pt.depth));
        const badgeMat = new THREE.SpriteMaterial({ map: badgeTex });
        const badge = new THREE.Sprite(badgeMat);
        badge.position.set(leaderOffsetX * 1.5, leaderOffsetY, 0);
        badge.scale.set(0.12, 0.035, 1.0);
        pinGroup.add(badge);

        leftForearm.add(pinGroup);
        pinObjects.push(pinGroup);
      });

      window.pinObjects = pinObjects;
      window.bones = { leftUpperArm, leftForearm };
      window.camera = camera;
      window.isReady = true;
    });

    // Animate camera and arm
    let targetCamPos = new THREE.Vector3(0, 0.34, 4.2);
    let targetLookAt = new THREE.Vector3(0, 0.34, 0);
    let currentCamPos = new THREE.Vector3(0, 0.34, 4.2);
    let currentLookAt = new THREE.Vector3(0, 0.34, 0);

    let targetArmZ = 0.0;
    let targetArmX = 0.0;
    let targetForearmZ = 0.0;

    window.triggerArmZoomAndPopups = () => {
      // 1. Arm moves forward/right
      targetArmZ = 0.65;
      targetArmX = -0.15;
      targetForearmZ = 0.35;

      // 2. Camera zooms directly to arm
      targetCamPos.set(-0.65, 0.68, 1.55);
      targetLookAt.set(-0.18, 0.58, 0.18);

      // 3. Sequentially pop up acupoints on arm one by one!
      if (window.pinObjects) {
        window.pinObjects.forEach((pin, idx) => {
          setTimeout(() => {
            pin.userData.targetScale = 1.0;
          }, 350 + idx * 280); // Staggered pop-up!
        });
      }
    };

    window.resetArmView = () => {
      targetArmZ = 0.0;
      targetArmX = 0.0;
      targetForearmZ = 0.0;
      targetCamPos.set(0, 0.34, 4.2);
      targetLookAt.set(0, 0.34, 0);
      if (window.pinObjects) {
        window.pinObjects.forEach(pin => {
          pin.userData.targetScale = 0.0;
        });
      }
    };

    document.getElementById('triggerBtn').addEventListener('click', window.triggerArmZoomAndPopups);

    function render() {
      requestAnimationFrame(render);

      // Smooth bone interpolation
      if (window.bones) {
        window.bones.leftUpperArm.rotation.z += (targetArmZ - window.bones.leftUpperArm.rotation.z) * 0.07;
        window.bones.leftUpperArm.rotation.x += (targetArmX - window.bones.leftUpperArm.rotation.x) * 0.07;
        window.bones.leftForearm.rotation.z += (targetForearmZ - window.bones.leftForearm.rotation.z) * 0.07;
      }

      // Smooth camera interpolation
      currentCamPos.lerp(targetCamPos, 0.06);
      currentLookAt.lerp(targetLookAt, 0.06);
      camera.position.copy(currentCamPos);
      camera.lookAt(currentLookAt);

      // Pop-up pin scale interpolation (spring bounce)
      if (window.pinObjects) {
        window.pinObjects.forEach(pin => {
          const ts = pin.userData.targetScale;
          pin.userData.currentScale += (ts - pin.userData.currentScale) * 0.14;
          const s = Math.max(0, pin.userData.currentScale);
          pin.scale.set(s, s, s);
        });
      }

      renderer.render(scene, camera);
    }
    render();
  </script>
</body>
</html>
